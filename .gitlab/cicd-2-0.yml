#
# New generation pipeline
#

spec:
  inputs:
    k8s_version:
      description: Kubernetes version for kubectl (passed to dist/images/Dockerfile)
      default: v1.29.8
    ovn_version:
      description: Version of OVN that is used to build containers
    ovs_version:
      description: Version of OVS that is used to build containers
    image_tag:
      description: Tag for OVN kuberentes images that will be produced
         or used during testing (if run_build_and_sign is set to false)
    run_check:
      description: Run checks (lint, gofmt, build, windows build) before building
         artifiacts
      type: boolean
      default: true
    run_unit_tests:
      description: Run unit tests before building artifiacts
      type: boolean
      default: true
    run_gitops:
      description: Run downstream pipeline in gitos to check artifacts
      type: boolean
      default: true
    gitops_branch:
      description: sdn/gitops repository branch that should be used for pipelines.
        Empty string means value of gitops_default_branch variable.
      type: string
      default: ''
    gitops_config:
      description: Addtional parameters passed to gitops repository in JSON
        format. Schema of the JSON is defined by gitops project.
      type: string
      default: '{}'
    gitops_helm_repo:
      description: repostitory that contains helm for deployment test.
      type: string
      default: sdn/sdn-helm/ovn-kubernetes
    gitops_helm_branch:
      description: repostitory that contains helm for deployment test.
      type: string
      default: main
    gitops_helm_values_yaml:
      description: values files to be patched with new container.
      type: string
      default: values-ngn.yaml
    gitops_helm_chart_version:
      description: version of helm chart that will be published.
      type: string
      default: .not-defined
    gitops_helm_need_merge:
      description: If true then helm merge request will be used to build helm chart
        to instead of regular helm branch.
      type: boolean
      default: false
    gitops_helm_need_merge_id:
      description: If gitops_helm_need_merge_id is true then this variable defines
        identifier of merge request that will be used to build helm chart.
      type: number
      default: 0
    run_build_and_sign:
      description: If set to false then skip build and sign phases
        run_check is still optional and can be run.
      type: boolean
      default: true
    force_instance_runners:
      description: Use gitlab instance runners for pipeline instead of
         using optimized project runners (for forked repositories)
      type: boolean
      default: false
    run_kind_e2e_tests:
      description: Run downstream kind e2e check pipeline to check artifacts
      type: boolean
      default: true
    kind_e2e_project_name:
      description: Source project name repo that triggered pipeline (needed for kind_e2e)
      type: string
    kind_e2e_project_path:
      description: Branch of the repo that triggered pipeline (needed for kind_e2e)
      type: string
    kind_e2e_repo_branch:
      description: Branch of the repo that triggered pipeline (needed for kind_e2e)
      type: string
    kind_e2e_repo_commit_sha:
      description: Commit sha on repo that triggered pipeline (needed for kind_e2e)
      type: string
    kind_e2e_mode:
      description: Mode of the kind e2e test. Either MERGE or PUSH.
      type: string
      options:
        - MERGE
        - PUSH
      default: PUSH
    kind_e2e_merge_request_id:
      description: Gitlab merge request id for MERGE mode.
      type: number
      default: 0
    sdn_cicd_branch:
      type: string
      default: master
      description: Branch in sdn/sdn-cicd repository that will be used
        for kind e2e pipelines.
    promote_helm:
      description: if set to true then promotion pipeline will be triggered
         in helm repository
      type: boolean
    promote_helm_repo:
      description: repostitory that handles promotion pipeline
      type: string
      default: sdn/sdn-helm/ovn-kubernetes
    promote_helm_branch:
      description: repostitory branch that handles promotion pipeline
      type: string
    promote_helm_values_yaml:
      description: yaml file in helm repo
      type: string
      default: values-images.yaml
    promote_helm_dry_run:
      description: yaml file in helm repo
      type: boolean
      default: false
    promote_helm_need_merge:
      description: helm promotion has associated
        merge request to the helm repository
      type: boolean
      default: false
    promote_helm_need_merge_id:
      description: If helm promotion has associated
        merge request to the helm repository then
        this input contains id of the merge request
        in ovn helm repository.
      type: number
      default: 0
    latest_tag:
      description: Name of latest tag for ovnkube-c and ovn-c. This
        input is only needed if promotion was initiated.
      type: string
    tag_latest_dry_run:
      description: If set to true then pipeline doesn't really
        do tagging but just print commands that would be executed
      type: boolean
      default: true
    email_message_to:
      description: To-field of e-mail
      type: string
      default: $GITLAB_USER_EMAIL
    email_message_subject:
      description: Subject of e-mail notification with generated artifaces
      type: string
      default: "$CI_PROJECT_TITLE CI pipleine branch: $CI_COMMIT_REF_NAME commit: $CI_COMMIT_SHORT_SHA"
    email_message_description:
      description: Description part of the sent email
      type: string
      default: |
        $GITLAB_USER_NAME just built and pushed ovnkube
        CommitID: $CI_COMMIT_SHORT_SHA
        Pipeline URL: $CI_PIPELINE_URL

---

variables:
  k8s_version: $[[ inputs.k8s_version ]]
  ovn_version: $[[ inputs.ovn_version ]]
  ovs_version: $[[ inputs.ovs_version ]]
  run_build_and_sign: $[[ inputs.run_build_and_sign ]]
  run_check: $[[ inputs.run_check ]]
  run_unit_tests: $[[ inputs.run_unit_tests ]]
  run_gitops: $[[ inputs.run_gitops ]]
  gitops_branch: $[[ inputs.gitops_branch ]]
  gitops_config: $[[ inputs.gitops_config ]]
  gitops_default_branch: "main"
  gitops_helm_repo: $[[ inputs.gitops_helm_repo ]]
  gitops_helm_branch: $[[ inputs.gitops_helm_branch ]]
  gitops_helm_values_yaml: $[[ inputs.gitops_helm_values_yaml ]]
  gitops_helm_chart_version: $[[ inputs.gitops_helm_chart_version ]]
  gitops_helm_need_merge: $[[ inputs.gitops_helm_need_merge ]]
  gitops_helm_need_merge_id: $[[ inputs.gitops_helm_need_merge_id ]]
  force_instance_runners: $[[ inputs.force_instance_runners ]]
  image_tag: $[[ inputs.image_tag ]]
  run_kind_e2e_tests: $[[ inputs.run_kind_e2e_tests ]]
  kind_e2e_project_path: $[[ inputs.kind_e2e_project_path ]]
  kind_e2e_project_name: $[[ inputs.kind_e2e_project_name ]]
  kind_e2e_repo_branch: $[[ inputs.kind_e2e_repo_branch ]]
  kind_e2e_repo_commit_sha: $[[ inputs.kind_e2e_repo_commit_sha ]]
  kind_e2e_mode: $[[ inputs.kind_e2e_mode ]]
  kind_e2e_merge_request_id: $[[ inputs.kind_e2e_merge_request_id ]]
  sdn_cicd_branch: $[[ inputs.sdn_cicd_branch ]]
  container_registry: nvcr.io
  container_registry_path: nv-ngn/sdn
  container_registry_tag_path: ${container_registry}/${container_registry_path}
  promote_helm: $[[ inputs.promote_helm ]]
  promote_helm_repo: $[[ inputs.promote_helm_repo ]]
  promote_helm_branch: $[[ inputs.promote_helm_branch ]]
  promote_helm_values_yaml: $[[ inputs.promote_helm_values_yaml ]]
  promote_helm_dry_run: $[[ inputs.promote_helm_dry_run ]]
  promote_helm_need_merge: $[[ inputs.promote_helm_need_merge ]]
  promote_helm_need_merge_id: $[[ inputs.promote_helm_need_merge_id ]]
  latest_tag: $[[ inputs.latest_tag ]]
  tag_latest_dry_run: $[[ inputs.tag_latest_dry_run ]]

stages:
  - setup-builder
  - make-and-check
  - build
  - sign
  - test
  - promote
  - tag-latest
  - notify

include:
  - .gitlab/runners-tags.yml
  - .gitlab/image-tag.yml

default:
  interruptible: true

.if-setup-builder:
  rules:
    - if: $run_build_and_sign == "true"

# AMD64 builder is used for run check
.if-setup-builder-rocky-amd64:
  rules:
    - if: >
        (  $run_build_and_sign == "true"
        || $run_check == "true"
        || $run_unit_tests == "true" )

.if-build:
  rules:
    - if: $run_build_and_sign == "true"

.if-sign:
  rules:
    - if: $run_build_and_sign == "true"

.if-sign-and-check:
  rules:
    - if: $run_build_and_sign == "true" && $run_check == "true"

.if-sign-unchecked:
  rules:
    - if: $run_build_and_sign == "true" && $run_check != "true"

.if-sdn-cicd-test:
  rules:
    - if: $run_kind_e2e_tests == "true"

.if-run-gitops:
  rules:
    - if: $run_gitops == "true"

.if-run-lint:
  rules:
    - if: $run_check == "true"

.if-run-make-and-check:
  rules:
    - if: $run_check == "true" || $run_unit_tests == "true"

.if-promote-helm:
  rules:
    - if: $promote_helm == "true"

.if-tag-latest-dry-run:
  rules:
    - if: $promote_helm == "true" && $tag_latest_dry_run == "true"

.if-tag-latest:
  rules:
    - if: $promote_helm == "true" && $tag_latest_dry_run != "true"

# Send e-mail after image sign
.if-send-notify-signed:
  rules:
    - if: >
        (  "true" == $run_build_and_sign
        && "true" != $promote_helm )

# Send e-mail after promotion
.if-send-notify-promoted:
  rules:
    - if: >
        (  "true" == $run_build_and_sign
        && "true" == $promote_helm )

# If nothing left in pipeline then do NOP job to prevent failure
.if-run-nop:
  rules:
    - if: >
        (  "true" != $run_check
        && "true" != $run_unit_tests
        && "true" != $run_kind_e2e_tests
        && "true" != $run_build_and_sign
        && "true" != $run_gitops
        && "true" != $promote_helm )

# ================================================================================
# Prepare builder images
#
# Input variables:
# dist - linux distribution to build (rocky / ubuntu)
# dist_version - linux distribution version (8.8 / 20.04
# platform - target architecture build
.setup-builder:
  stage: setup-builder
  image: ${builder_image}
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin
    - make dist=${dist} platform=${platform} GITLAB_API_TOKEN=${CI_JOB_TOKEN} controller-dir=$(pwd)/go-controller -C .gitlab/containers
    - image_current_tag=`cat .gitlab/containers/_registry/current-tag`
    - |
      cat > ./builder-image.yaml <<EOF
      variables:
        image: ${image_current_tag}
        dist: ${dist}
        dist_version: ${dist_version}
        platform: ${platform}
        k8s_version: ${k8s_version}
        ovn_version: ${ovn_version}
        ovs_version: ${ovs_version}
        builder_image: ${builder_image}
        image_tag: ${image_tag}
        container_registry: ${container_registry}
        container_registry_tag_path: ${container_registry_tag_path}
        force_instance_runners: ${force_instance_runners}
        run_check: ${run_check}
        run_unit_tests: ${run_unit_tests}
      include:
        - .gitlab/runners-tags.yml
      EOF
    - |
      if [[ $force_instance_runners == true ]] ; then cat >> ./builder-image.yaml <<EOF
      .unit-test-tags:
        extends:
          - .tags-amd64
      EOF
      fi
    - |
      if [[ $force_instance_runners == false ]] ; then cat >> ./builder-image.yaml <<EOF
      .unit-test-tags:
        tags:
          - sdn-cicd-16-runner
      EOF
      fi
    - cat builder-image.yaml
  artifacts:
    paths:
      - builder-image.yaml

setup-builder:rocky8.8-amd64:
  variables:
    platform: amd64
    dist: rocky
    dist_version: 8.8
  extends:
    - .tags-amd64
    - .setup-builder
    - .if-setup-builder-rocky-amd64

setup-builder:rocky8.8-arm64:
  variables:
    platform: arm64
    dist: rocky
    dist_version: 8.8
  extends:
    - .tags-arm64
    - .setup-builder
    - .if-setup-builder

setup-builder:ubuntu20.04-arm64:
  variables:
    platform: arm64
    dist: ubuntu
    dist_version: 20.04
  extends:
    - .tags-arm64
    - .setup-builder
    - .if-setup-builder

# ================================================================================
# Make and check for amd64
#
make-and-check:rocky8.8-amd64:
  stage: make-and-check
  extends:
    - .if-run-make-and-check
  needs:
    - setup-builder:rocky8.8-amd64
  trigger:
    strategy: depend
    include:
      - artifact: builder-image.yaml
        job: setup-builder:rocky8.8-amd64
      - .gitlab/make-and-check-amd64.yml

make-lint:
  stage: make-and-check
  extends:
    - .tags-amd64
    - .if-run-lint
  image: golangci/golangci-lint:v1.59
  needs: []
  script:
    - pushd go-controller && golangci-lint run --max-same-issues 0 --verbose --print-resources-usage --modules-download-mode=vendor --timeout=15m0s && popd

# ================================================================================
# Build binaries for target platforms
#
build:rocky8.8-amd64:
  stage: build
  extends:
    - .if-build
  needs:
    - setup-builder:rocky8.8-amd64
  trigger:
    strategy: depend
    include:
      - artifact: builder-image.yaml
        job: setup-builder:rocky8.8-amd64
      - .gitlab/build-amd64.yml

build:rocky8.8-arm64:
  stage: build
  extends:
    - .if-build
  needs:
    - setup-builder:rocky8.8-arm64
  trigger:
    strategy: depend
    include:
      - artifact: builder-image.yaml
        job: setup-builder:rocky8.8-arm64
      - .gitlab/build-arm64.yml

build:ubuntu20.04-arm64:
  stage: build
  extends:
    - .if-build
  needs:
    - setup-builder:ubuntu20.04-arm64
  trigger:
    strategy: depend
    include:
      - artifact: builder-image.yaml
        job: setup-builder:ubuntu20.04-arm64
      - .gitlab/build-arm64.yml

# ================================================================================
# Build multiarch image:
#
build:rocky8.8-multiarch:
  stage: build
  image: ${builder_image}
  extends:
    - .tags-amd64
    - .if-build
  needs:
    - build:rocky8.8-arm64
    - build:rocky8.8-amd64
  script:
    - docker login -u=\$oauthtoken -p=${NVCR_PASS} ${container_registry}
    - |
      make -C .gitlab/build-image -f multiarch.mk \
            dist=rocky \
            platforms="arm64 amd64" \
            image-tag=${image_tag} \
            registry-tag-path=${container_registry_tag_path}

build-netprobes:rocky8.8-multiarch:
  stage: build
  image: ${builder_image}
  extends:
    - .tags-amd64
    - .if-build
  needs:
    - build:rocky8.8-arm64
    - build:rocky8.8-amd64
  script:
    - docker login -u=\$oauthtoken -p=${NVCR_PASS} ${container_registry}
    - |
      make -C .gitlab/build-image -f multiarch-netprobes.mk \
            dist=rocky \
            platforms="arm64 amd64" \
            image-tag=${image_tag} \
            registry-tag-path=${container_registry_tag_path}

# ================================================================================
# Sign images
# TODO: image names must be get from make -C .gitlab/build-image ...
.sign:
  image: ${builder_image}
  extends:
    - .tags-amd64
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - docker login -u=\$oauthtoken -p=${NVCR_PASS} ${container_registry}
    - cosign login -u \$oauthtoken -p ${NVCR_PASS} ${container_registry}
    - sign_args="nvsec-client-id=${STARFLEET_USER} nvsec-client-secret=${STARFLEET_PASS} output=image.tag"
    - make -C .gitlab/tools/image-sign ${sign_args} image-name=${container_registry_tag_path}/ovn-c:${image_tag}
    - make -C .gitlab/tools/image-sign ${sign_args} image-name=${container_registry_tag_path}/ovnkube-c:${image_tag}
    - make -C .gitlab/tools/image-sign ${sign_args} image-name=${container_registry_tag_path}/ovnkube-networkprobe-target:${image_tag}
    - make -C .gitlab/tools/image-sign ${sign_args} image-name=${container_registry_tag_path}/ovn-c-arm64:${image_tag}
    - make -C .gitlab/tools/image-sign ${sign_args} image-name=${container_registry_tag_path}/ovnkube-c-arm64:${image_tag}
    - make -C .gitlab/tools/image-sign ${sign_args} image-name=${container_registry_tag_path}/ovnkube-networkprobe-target-arm64:${image_tag}
    - cp .gitlab/tools/image-sign/image.tag .
  artifacts:
    paths:
      - image.tag

# Sign only if all tests are successful
sign-checked:
  stage: sign
  extends:
    - .if-sign-and-check
    - .sign
  needs:
    - make-lint
    - make-and-check:rocky8.8-amd64
    - build:rocky8.8-multiarch
    - build-netprobes:rocky8.8-multiarch
    - build:ubuntu20.04-arm64

# Sign after build
sign-not-checked:
  stage: sign
  extends:
    - .if-sign-unchecked
    - .sign
  needs:
    - build:rocky8.8-multiarch
    - build-netprobes:rocky8.8-multiarch
    - build:ubuntu20.04-arm64

# Just collect artifacts from sign-checked or sign-not-checked
sign:
  stage: sign
  extends:
    - .tags-amd64
    - .if-sign
  needs:
    - job: sign-not-checked
      optional: true
    - job: sign-checked
      optional: true
  script:
    - cat image.tag
  artifacts:
    paths:
      - image.tag


# ================================================================================
# Tests
#
# We run downstream pipeline to isolate local variables from
# downstream. Apparently today this is the only way to force interpolation
# of some local variables without exposing ALL of them to downstream.
#
# Why not directly use of trigger:project:
#   1. Setting job:variables does not interpolate variables recrusively and therefore ovn_kubernetes_image_tag
#      is set to "$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID" and this causes that CI_COMMIT_SHORT_SHA and CI_PIPELINE_ID
#      have value from downstream pipeline
#
#   2. Trigger with trigger:forward:yaml_variables == true passes ALL local
#      variables to downstream and can override downstream variables with surprising
#      results.
#
#   3. inherit:variables:false together with trigger:forward:yaml_variables == true prevents passing all local variables
#      to downstream but unfortunatelly in this case job:variables are also only interpolated to ONE level (as in (1))
#
prepare-sdn-cicd:
  stage: test
  extends:
    - .tags-amd64
    - .if-sdn-cicd-test
  script:
    - |
      cat > ./.gitlab/sdn-cicd-vars.yml <<EOF
      variables:
        kind_e2e_project_name: $kind_e2e_project_name
        kind_e2e_project_path: $kind_e2e_project_path
        kind_e2e_repo_branch: $kind_e2e_repo_branch
        kind_e2e_repo_commit_sha: $kind_e2e_repo_commit_sha
        kind_e2e_mode: $kind_e2e_mode
        kind_e2e_merge_request_id: $kind_e2e_merge_request_id
        ovn_kubernetes_image_tag: $image_tag
        image_tag: $image_tag
        sdn_cicd_branch: $sdn_cicd_branch
        run_kind_e2e_tests: $run_kind_e2e_tests
      EOF
    - cat .gitlab/sdn-cicd-vars.yml
  artifacts:
    paths:
      - .gitlab/sdn-cicd-vars.yml

sdn-cicd:
  stage: test
  extends:
    - .if-sdn-cicd-test
  needs:
    - prepare-sdn-cicd
  trigger:
    strategy: depend
    include:
      - artifact: .gitlab/sdn-cicd-vars.yml
        job: prepare-sdn-cicd
      - .gitlab/sdn-cicd-run.yml

gitops:helm:prepare:
  stage: test
  extends:
    - .tags-amd64
    - .if-run-gitops
  needs:
    - sign
  script:
    - build_helm_ovn_c_sha256=`grep "^${container_registry_tag_path}/ovn-c:" image.tag | sed s/.*@sha256://`
    - build_helm_ovn_c_arm64_sha256=`grep "^${container_registry_tag_path}/ovn-c-arm64:" image.tag | sed s/.*@sha256://`
    - build_helm_ovnkube_c_sha256=`grep "^${container_registry_tag_path}/ovnkube-c:" image.tag | sed s/.*@sha256://`
    - build_helm_ovnkube_c_arm64_sha256=`grep "^${container_registry_tag_path}/ovnkube-c-arm64:" image.tag | sed s/.*@sha256://`
    - |
      cat > ./.gitlab/helm-run-vars.yml <<EOF
      variables:
        helm_repo: ${gitops_helm_repo}
        helm_branch: ${gitops_helm_branch}
        helm_action: build
        build_helm_image_tag: ${image_tag}
        build_helm_ovnkube_c_sha256: ${build_helm_ovnkube_c_sha256}
        build_helm_ovn_c_sha256: ${build_helm_ovn_c_sha256}
        build_helm_ovn_c_arm64_sha256: ${build_helm_ovn_c_arm64_sha256}
        build_helm_ovnkube_c_arm64_sha256: ${build_helm_ovnkube_c_arm64_sha256}
        build_helm_chart_version: ${gitops_helm_chart_version}
        build_helm_values_yaml: ${gitops_helm_values_yaml}
        build_helm_need_merge: ${gitops_helm_need_merge}
        build_helm_need_merge_id: ${gitops_helm_need_merge_id}
      EOF
    - cat .gitlab/helm-run-vars.yml
  artifacts:
    paths:
      - .gitlab/helm-run-vars.yml

gitops:helm:
  stage: test
  extends:
    - .if-run-gitops
  needs:
    - gitops:helm:prepare
  trigger:
    strategy: depend
    include:
      - artifact: .gitlab/helm-run-vars.yml
        job: gitops:helm:prepare
      - local: .gitlab/helm-run.yml

prepare-gitops-run:
  stage: test
  extends:
    - .tags-amd64
    - .if-run-gitops
  needs:
    - gitops:helm
  script:
    - |
      cat > ./.gitlab/gitops-run-vars.yml <<EOF
      variables:
        sdn_gitops_branch: ${gitops_branch:-${gitops_default_branch}}
        GITOPS_CONFIG: '${gitops_config}'
        OVN_KUBERNETES_IMAGE_TAG: ${image_tag}
        OVN_KUBERNETES_HELM: nv-ngn/sdn/ovn-kubernetes:${gitops_helm_chart_version}
      EOF
    - cat .gitlab/gitops-run-vars.yml
  artifacts:
    paths:
      - .gitlab/gitops-run-vars.yml

run-gitops:
  stage: test
  extends:
    - .if-run-gitops
  needs:
    - prepare-gitops-run
  trigger:
    strategy: depend
    include:
      - artifact: .gitlab/gitops-run-vars.yml
        job: prepare-gitops-run
      - .gitlab/gitops-run.yml

# ================================================================================
# Promotion
#
promote-helm:prepare:
  stage: promote
  extends:
    - .tags-amd64
    - .if-promote-helm
  needs:
    - sign
    - job: run-gitops
      optional: true
    - job: sdn-cicd
      optional: true
  script:
    - promote_helm_ovn_c_sha256=`grep "^${container_registry_tag_path}/ovn-c:" image.tag | sed s/.*@sha256://`
    - promote_helm_ovn_c_arm64_sha256=`grep "^${container_registry_tag_path}/ovn-c-arm64:" image.tag | sed s/.*@sha256://`
    - promote_helm_ovnkube_c_sha256=`grep "^${container_registry_tag_path}/ovnkube-c:" image.tag | sed s/.*@sha256://`
    - promote_helm_ovnkube_c_arm64_sha256=`grep "^${container_registry_tag_path}/ovnkube-c-arm64:" image.tag | sed s/.*@sha256://`
    - |
      cat > ./.gitlab/helm-run-vars.yml <<EOF
      variables:
        helm_repo: $promote_helm_repo
        helm_branch: $promote_helm_branch
        promote_helm_image_tag: $image_tag
        promote_helm_ovn_c_sha256: $promote_helm_ovn_c_sha256
        promote_helm_ovn_c_arm64_sha256: $promote_helm_ovn_c_arm64_sha256
        promote_helm_ovnkube_c_sha256: $promote_helm_ovnkube_c_sha256
        promote_helm_ovnkube_c_arm64_sha256: $promote_helm_ovnkube_c_arm64_sha256
        promote_helm_values_yaml: $promote_helm_values_yaml
        promote_helm_dry_run: $promote_helm_dry_run
        promote_helm_need_merge: $promote_helm_need_merge
        promote_helm_need_merge_id: $promote_helm_need_merge_id
      EOF
    - cat .gitlab/helm-run-vars.yml
  artifacts:
    paths:
      - .gitlab/helm-run-vars.yml

promote-helm:
  stage: promote
  extends:
    - .if-promote-helm
  needs:
    - promote-helm:prepare
  trigger:
    strategy: depend
    include:
      - artifact: .gitlab/helm-run-vars.yml
        job: promote-helm:prepare
      - local: .gitlab/helm-run.yml


# ================================================================================
# Latest artifiact tagging
.tag-latest:
  stage: tag-latest
  image: ${builder_image}
  needs:
    - promote-helm
    - sign
  script:
    - if [[ -z ${dry_run_value} ]] ; then exit 1 ; fi
    - docker login -u=\$oauthtoken -p=${NVCR_PASS} ${container_registry}
    - |
      make tag-latest -C .gitlab/build-image -f multiarch.mk \
            dry-run=${dry_run_value} \
            dist=rocky \
            platforms="arm64 amd64" \
            image-tag=${image_tag} \
            registry-tag-path=${container_registry_tag_path} \
            latest-tag=${latest_tag}
    - |
      make tag-latest -C .gitlab/build-image -f build-and-push.mk \
            dry-run=${dry_run_value} \
            dist=ubuntu \
            platform="arm64" \
            image-tag=${image_tag} \
            registry-tag-path=${container_registry_tag_path} \
            latest-tag=${latest_tag}

tag-latest:dry-run:
  stage: tag-latest
  extends:
    - .if-tag-latest-dry-run
    - .tag-latest
    - .tags-amd64
  variables:
    dry_run_value: true

tag-latest:
  stage: tag-latest
  extends:
    - .if-tag-latest
    - .tag-latest
    - .tags-amd64
  variables:
    dry_run_value: false

# ================================================================================
# Send e-mail to pipeline inititor
#
.notify:
  stage: notify
  image: gitlab-master.nvidia.com:5005/ngc/apps/woof:latest
  variables:
    to: $[[ inputs.email_message_to ]]
    subject: $[[ inputs.email_message_subject ]]
    notify_msg_file: .gitlab/_email_message
  script:
    - |
      cat | sed 's/$/ <br\/>/' > $notify_msg_file  <<EOF
      $[[ inputs.email_message_description ]]
      ---
      Artifacts
      EOF
    - cat image.tag | sed 's/$/ <br\/>/' >> $notify_msg_file
    - /tmp/sendmail.py "$to" "$subject" --msg "`cat $notify_msg_file`"

notify:checked:
  stage: notify
  image: gitlab-master.nvidia.com:5005/ngc/apps/woof:latest
  extends:
    - .notify
    - .tags-amd64
    - .if-send-notify-signed
  needs:
    - sign
    - job: run-gitops
      optional: true
    - job: sdn-cicd
      optional: true

notify:promoted:
  stage: notify
  image: gitlab-master.nvidia.com:5005/ngc/apps/woof:latest
  extends:
    - .notify
    - .tags-amd64
    - .if-send-notify-promoted
  needs:
    - sign
    - promote-helm

# ================================================================================
# If nothing else need to be done in pipeline
#
nop:
  stage: test
  extends:
    - .tags-amd64
    - .if-run-nop
  script:
    - echo No tests needed. Prevent pipeline failure by NOP.
