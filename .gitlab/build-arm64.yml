
stages:
  - build
  - image

include:
  - .gitlab/runners-tags.yml
  - .gitlab/build-common.yml

default:
  interruptible: true

build:arm64:
  stage: build
  image: ${image}
  extends:
    - .tags-arm64
    - .ovn-k8s-build-ovn
    - .always

image:arm64:
  image: ${builder_image}
  stage: image
  extends:
    - .tags-arm64
    - .ovn-k8s-build-image
    - .always

image-netprobes:arm64:
  image: ${builder_image}
  stage: image
  extends:
    - .tags-arm64
    - .ovn-k8s-build-netprobes-image
    - .always
