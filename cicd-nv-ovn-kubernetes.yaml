# This yaml describes how to build, deploy, test and submit artifacts for NV ovn-kubernetes
# ovn-kubernetes depends on OVN and OVS artifacts

projectID: 2649
buildOvnKubernetes:
  OVN:
    pkgTag: 24.03.2.fbe9b955.18947834
  OVS:
    pkgTag: 3.3.1.5f875996.19422428
    
# helm deployment info for this branch
# These repos and branches will be used by CICD to deploy the relevant helm charts
# on the CICD rig chosen
deploy:
  helm:
    ovn-kubernetes:
      repo: ssh://git@gitlab-master.nvidia.com:12051/sdn/sdn-helm/ovn-kubernetes.git
      branch: nv-1.2
      values_yaml: values-images.yaml
    multus:
      repo: ssh://git@gitlab-master.nvidia.com:12051/sdn/sdn-helm/multus.git
      branch: main
    sriov-network-device-plugin:
      repo: ssh://git@gitlab-master.nvidia.com:12051/sdn/sdn-helm/sriov-network-device-plugin.git
      branch: main
    sdn-mutator:
      repo: ssh://git@gitlab-master.nvidia.com:12051/sdn/sdn-helm/sdn-mutator.git
      branch: main

test:
  flowTests:
    repo: ssh://git@gitlab-master.nvidia.com:12051/sdn/ovn-k8s-flow-tests.git
    branch: nv-main
    commitID: HEAD
    MR: 0

cicd:
  skip_make_check: false
  skip_SDN_tests: false
  SDN_LOCK_lock_on_failure: false 
  sdn_cicd_branch: master


# This section describes in which branch and repo to commit the new artifacts in the merge/push case
artifacts:
  # Only mark yes if the artifacts built from this branch should end up in SDN ovn-kubernetes helm charts repo
  promote: yes
  latestImageNameTag: latest-nv-1.2
  helm:
    repo: ssh://git@gitlab-master.nvidia.com:12051/sdn/sdn-helm/ovn-kubernetes.git
    projectID: 109659
    branch: nv-1.2
    values_yaml: values-images-latest.yaml


