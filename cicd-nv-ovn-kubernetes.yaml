test:
  flowTests:
    repo: ssh://git@gitlab-master.nvidia.com:12051/sdn/ovn-k8s-flow-tests.git
    branch: nv-main
    commitID: HEAD
    MR: 0
  cicd-tests:
    ic:
      run-groups:
        - all-ic
    central:
      run-groups:
        - basic
    VMaaS:
      run-groups:
        - all-VMaaS
cicd:
  # Mark skip_CICD_deploy_and_tests true to skip deploy and all tests
  skip_CICD_deploy_and_tests: false
  skip_make_check: false
  skip_all_checks: false
  skip_flowTests: false
  skip_SDN_tests: false
  # Set deployment modes, valid values are: VMaaS-ic, NGN-ic, NGN-central
  deployment_mode: VMaaS-ic, NGN-ic, NGN-central
  # CICD Rigs are organized in pools. We currently have OVN-K8S-VALIDATION-RIGS, CICD-OVN-IC-RIGS and OVN-UPSTREAM-VALIDATION-RIGS
  # Ask for a rig pool. Default empty means cicd choose for you.
  cicd_rig_pool: ""
  # Ask for a specific rig within a specific pool. Default empy means cicd choose for you.
  cicd_rig: ""
# This section describes in which branch and repo to commit the new artifacts in the merge/push case
artifacts:
  # Only mark yes if the artifacts built from this branch should end up in SDN ovn-kubernetes helm charts repo
  promote: yes
  latestImageNameTag: latest-nv-1.4
  helm:
    repo: ssh://git@gitlab-master.nvidia.com:12051/sdn/sdn-helm/ovn-kubernetes.git
    projectID: 109659
    branch: nv-1.4
    values_yaml: values-images.yaml
