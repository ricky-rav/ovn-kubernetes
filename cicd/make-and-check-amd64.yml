
stages:
  - make-and-check

include:
  - cicd/runners-tags.yml

default:
  interruptible: true

.always:
  rules:
    - when: always

make-build:amd64:
  stage: make-and-check
  image: ${image}
  extends:
    - .tags-amd64
    - .always
  script:
    - make build -C go-controller

make-windows:amd64:
  stage: make-and-check
  image: ${image}
  extends:
    - .tags-amd64
    - .always
  script:
    - make windows -C go-controller

make-gofmt:amd64:
  stage: make-and-check
  image: ${image}
  extends:
    - .tags-amd64
    - .always
  script:
    - make gofmt -C go-controller

unit-tests:amd64:
  stage: make-and-check
  image: ${image}
  extends:
    # .unit-tests-tags are generated by caller. Unfortunatelly
    # there is no way to setup set of tags using variable (array varables
    # are not supported by gitlab). And variables are not supported
    # in extends. So we cannot define variable with set of tags
    # nor define two base items with different set of tags.
    - .unit-test-tags
    - .always
  parallel: 11
  timeout: 6 minutes
  script:
    - mkdir _build
    - make -C cicd/unit-tests build-dir=$(pwd)/_build controller-dir=$(pwd)/go-controller group-no=$CI_NODE_INDEX groups-total=$CI_NODE_TOTAL
  artifacts:
    paths:
      - '_build/*.log.gz'
      - '_build/*.coverprofile'
      - '_build/junit-*.xml'
