#
# This is just bridging pipeline between
# ovn-kubernetes pipelines and sdn/sdn-cicd pipeline.
# Purpose of it is variables isolation (see details in .gitlab-ci.yml)
#
stages:
  - downstream

.always:
  rules:
    - when: always

default:
  interruptible: true

trigger-sdn-cicd-run:
  stage: downstream
  extends:
    - .always
  trigger:
    project: sdn/sdn-cicd
    branch: $sdn_cicd_branch
    strategy: depend
    forward:
      yaml_variables: true
